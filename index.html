<!DOCTYPE html>
<!--
  ============================================================================
  Template Name   : BunBun Vercel Static CSR Frontend (index.html)
  Version         : v1.0.0
  Backend API     : https://bunbunserver.my.id (Refer to API_ENDPOINT_DOCS.md)
  Target Platform : Vercel Static Hosting + Vercel Serverless Functions (/api/sitemap.js)
  Routes & Pages  : 1. Homepage           (/ or /?page=home)
                       -> Priority #1 Fetch: GET /api/articles/random?limit=24
                       -> <head>: Canonical (/), Title, Meta Robots, Meta SEO, WebSite + ItemList JSON-LD
                    2. Category Page      (/?category=<category>)
                       -> Priority #1 Fetch: GET /api/category/<category>?limit=24
                       -> <head>: Canonical (/?category=<category>), Title, 2 Meta Only (meta robots + meta seo), Zero JSON-LD
                    3. Single Article     (/?category=<category>&slug=<slug>)
                       -> Priority #1 Fetch: GET /api/article?category=<category>&slug=<slug> (Sentences & Images first)
                       -> <head>: Canonical (/?category=<category>&slug=<slug>), Title, Meta Robots, Meta SEO,
                                  Article JSON-LD, BreadcrumbList JSON-LD
                       -> No categories listing in header navigation on Single Article page
                       -> Priority #2 Deferred (priority: 'low' after article text & images mount):
                          a) Related Posts: GET /api/articles/random?limit=10
                          b) Related Links: GET /api/articles/random?limit=5 + GET /api/domains/status
                    4. XML Sitemap        (/sitemap.xml -> Vercel Serverless Function /api/sitemap.js)
                       -> Reads https://bunbunserver.my.id/sitemap.xml, rewrites all <loc> URLs to the
                          receiving Vercel subdomain address, and returns application/xml.
  ============================================================================
-->
<html lang="en" dir="ltr" data-api-endpoint="https://bunbunserver.my.id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- ===================================================================== -->
  <!-- 1. DNS PRECONNECT & PREFETCH (API Endpoint, Fonts URL, Image CDNs)    -->
  <!-- ===================================================================== -->
  <link rel="preconnect" href="https://bunbunserver.my.id" crossorigin="anonymous" />
  <link rel="dns-prefetch" href="https://bunbunserver.my.id" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
  <link rel="preconnect" href="https://cdn.tailwindcss.com" />
  <link rel="dns-prefetch" href="https://blogger.googleusercontent.com" />
  <link rel="dns-prefetch" href="https://lh3.googleusercontent.com" />
  <link rel="dns-prefetch" href="https://i0.wp.com" />

  <!-- ===================================================================== -->
  <!-- 2. PUBSUBHUBBUB HUB, SITEMAP XML & ATOM FEED LINKS                    -->
  <!-- ===================================================================== -->
  <link rel="hub" href="https://pubsubhubbub.appspot.com" />
  <link id="sitemap-xml-link" rel="sitemap" type="application/xml" title="Sitemap" href="https://bunbunserver.my.id/sitemap.xml" />
  <link id="atom-feed-link" rel="alternate" type="application/atom+xml" title="Technical Knowledgebase - Atom" href="https://bunbunserver.my.id/atom.xml" />

  <!-- ===================================================================== -->
  <!-- 3. INITIAL TITLE, CANONICAL URL & 2 CORE SEO META TAGS                -->
  <!--    (1. meta robots, 2. meta seo)                                      -->
  <!-- ===================================================================== -->
  <title>Technical Knowledgebase</title>
  <link id="canonical-url" rel="canonical" href="https://bunbunserver.my.id/" />
  <meta id="meta-robots" name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
  <meta id="meta-seo" name="description" content="Verified technical guides, diagnostic procedures, and engineering diagrams." />

  <!-- ===================================================================== -->
  <!-- 4. SYNCHRONOUS CANONICAL URL INIT + PRIORITY #1 API FETCH IN <HEAD>   -->
  <!--    Detects the active Vercel subdomain/domain origin at millisecond 0 -->
  <!--    and initiates the Priority #1 API fetch before <body> parses.      -->
  <!-- ===================================================================== -->
  <script>
  (function() {
    var htmlEl = document.documentElement;
    var API_ENDPOINT = (htmlEl.getAttribute('data-api-endpoint') || 'https://bunbunserver.my.id').trim().replace(/\/+$/, '');

    var loc = window.location || {};
    var hasValidHttpOrigin = Boolean(
      loc.origin &&
      loc.origin !== 'null' &&
      /^https?:\/\//i.test(loc.origin)
    );

    // Active Vercel subdomain / custom domain origin (e.g. https://autotech-hub.vercel.app)
    var vercelOrigin = hasValidHttpOrigin
      ? loc.origin.replace(/\/+$/, '')
      : 'https://autotech-hub.vercel.app';

    var hostname = String(loc.hostname || '').trim() || 'autotech-hub.vercel.app';
    var siteTitle = (htmlEl.getAttribute('data-site-title') || '').trim() ||
      ((hostname && hostname !== 'localhost' && hostname !== '127.0.0.1' && hasValidHttpOrigin)
        ? hostname
        : 'Technical Knowledgebase');

    function resolveRouteFromLocation() {
      var params = new URLSearchParams(loc.search || '');
      var rawHash = String(loc.hash || '').replace(/^#\/?/, '');

      if (rawHash.indexOf('?') !== -1) {
        var hashParams = new URLSearchParams(rawHash.split('?')[1]);
        hashParams.forEach(function(val, key) {
          if (!params.get(key)) params.set(key, val);
        });
      }

      var category = (params.get('category') || params.get('db') || '').trim();
      var slug = (params.get('slug') || '').trim();
      var page = (params.get('page') || params.get('view') || '').trim().toLowerCase();
      var q = (params.get('q') || params.get('keyword') || '').trim();
      var cleanHashName = rawHash.split('?')[0].replace(/^\/+|\/+$/g, '').toLowerCase();
      var pathname = String(loc.pathname || '/').toLowerCase();

      if (page === 'sitemap' || cleanHashName === 'sitemap' || pathname === '/sitemap.xml') {
        return { pageMode: 'sitemap', category: category, slug: '', q: q };
      }
      if (category && slug) {
        return { pageMode: 'article', category: category, slug: slug, q: '' };
      }
      if (category) {
        return { pageMode: 'category', category: category, slug: '', q: q };
      }
      return { pageMode: 'home', category: '', slug: '', q: q };
    }

    function buildCanonicalForRoute(route) {
      if (route.pageMode === 'article') {
        return vercelOrigin + '/?category=' + encodeURIComponent(route.category) + '&slug=' + encodeURIComponent(route.slug);
      }
      if (route.pageMode === 'category') {
        return vercelOrigin + '/?category=' + encodeURIComponent(route.category);
      }
      if (route.pageMode === 'sitemap') {
        return vercelOrigin + '/sitemap.xml';
      }
      return vercelOrigin + '/';
    }

    function buildPrimaryApiUrl(route) {
      if (route.pageMode === 'article') {
        return API_ENDPOINT + '/api/article?category=' + encodeURIComponent(route.category) + '&slug=' + encodeURIComponent(route.slug);
      }
      if (route.pageMode === 'category') {
        var catParams = new URLSearchParams({ limit: '24' });
        if (route.q) catParams.set('q', route.q);
        return API_ENDPOINT + '/api/category/' + encodeURIComponent(route.category) + '?' + catParams.toString();
      }
      if (route.pageMode === 'sitemap') {
        return API_ENDPOINT + '/sitemap.xml?domain=all&db=all&limit=500';
      }
      var homeParams = new URLSearchParams({ limit: '24' });
      if (route.q) homeParams.set('q', route.q);
      return API_ENDPOINT + '/api/articles/random?' + homeParams.toString();
    }

    var initialRoute = resolveRouteFromLocation();
    var initialCanonical = buildCanonicalForRoute(initialRoute);
    var initialApiUrl = buildPrimaryApiUrl(initialRoute);

    // 1. Set Canonical URL, Sitemap XML Link & Atom Feed Link synchronously in <head>
    var canonicalEl = document.getElementById('canonical-url');
    if (canonicalEl) {
      canonicalEl.setAttribute('href', initialCanonical);
    }
    var sitemapLinkEl = document.getElementById('sitemap-xml-link');
    if (sitemapLinkEl) {
      sitemapLinkEl.setAttribute('href', vercelOrigin + '/sitemap.xml');
    }
    var atomEl = document.getElementById('atom-feed-link');
    if (atomEl) {
      atomEl.setAttribute('href', API_ENDPOINT + '/atom.xml?domain=all&db=all');
      atomEl.setAttribute('title', siteTitle + ' - Atom 1.0 Feed');
    }

    // 2. Set initial baseline <title> and #meta-seo synchronously based on route
    var metaSeoEl = document.getElementById('meta-seo');
    if (initialRoute.pageMode === 'article') {
      var readableSlug = initialRoute.slug.replace(/[-_]+/g, ' ').replace(/\b\w/g, function(c) { return c.toUpperCase(); });
      document.title = readableSlug + ' - ' + siteTitle;
      if (metaSeoEl) {
        metaSeoEl.setAttribute('content', readableSlug + ' technical specification and reference diagrams on ' + siteTitle + '.');
      }
    } else if (initialRoute.pageMode === 'category') {
      var readableCat = initialRoute.category.replace(/[-_]+/g, ' ').replace(/\b\w/g, function(c) { return c.toUpperCase(); });
      document.title = readableCat + ' - ' + siteTitle;
      if (metaSeoEl) {
        metaSeoEl.setAttribute('content', 'Browse random ' + readableCat + ' technical articles and diagrams on ' + siteTitle + '.');
      }
    } else if (initialRoute.pageMode === 'sitemap') {
      document.title = 'XML Sitemap (' + siteTitle + ')';
      if (metaSeoEl) {
        metaSeoEl.setAttribute('content', 'Dynamic XML Sitemap rewritten to ' + vercelOrigin + ' via Vercel Serverless Function.');
      }
    } else {
      document.title = siteTitle;
      if (metaSeoEl) {
        metaSeoEl.setAttribute('content', 'Explore technical guides and engineering diagrams from global databases on ' + siteTitle + '.');
      }
    }

    // 3. Fire Priority #1 API Fetch in <head>
    var dataPromise;
    if (initialRoute.pageMode === 'sitemap') {
      dataPromise = fetch(initialApiUrl, {
        method: 'GET',
        headers: { 'Accept': 'application/xml, text/xml, */*' },
        priority: 'high'
      }).then(function(response) {
        if (!response.ok) throw new Error('HTTP ' + response.status);
        return response.text();
      });
    } else {
      dataPromise = fetch(initialApiUrl, {
        method: 'GET',
        headers: { 'Accept': 'application/json' },
        priority: 'high'
      }).then(function(response) {
        if (!response.ok) {
          var error = new Error('HTTP ' + response.status);
          error.status = response.status;
          throw error;
        }
        return response.json();
      });
    }

    window.__BUNBUN_VERCEL_CSR__ = {
      templateName: 'BunBun Vercel Static CSR',
      templateVersion: '1.0.0',
      apiEndpoint: API_ENDPOINT,
      vercelOrigin: vercelOrigin,
      hostname: hostname,
      hasValidHttpOrigin: hasValidHttpOrigin,
      blogTitle: siteTitle,
      blogDescription: 'Explore technical guides, specifications, and reference diagrams across all categories on ' + siteTitle + '.',
      pageMode: initialRoute.pageMode,
      category: initialRoute.category,
      slug: initialRoute.slug,
      q: initialRoute.q || '',
      canonicalUrl: initialCanonical,
      dataPromise: dataPromise,
      resolveRouteFromLocation: resolveRouteFromLocation,
      buildCanonicalForRoute: buildCanonicalForRoute,
      buildPrimaryApiUrl: buildPrimaryApiUrl
    };
  })();
  </script>

              '<h2 class="' + TW.relatedHeader + '">Related Posts</h2>' +
              '<div class="' + TW.relatedList + '">' + itemsHtml + '</div>' +
            '</aside>';
        });
    }

    /**
     * NON-PRIORITY COMPONENT #2 (SINGLE ARTICLE PAGE ONLY): RELATED LINKS (limit=5)
     */
    function fetchAndRenderRelatedLinksDeferred(currentSlug) {
      var mountEl = document.getElementById('article-related-links-mount');
      if (!mountEl) return;

      var lowPriorityOpts = {
        method: 'GET',
        headers: { 'Accept': 'application/json' },
        priority: 'low'
      };

      Promise.all([
        fetch(csr.apiEndpoint + '/api/articles/random?limit=5', lowPriorityOpts)
          .then(function(r) { return r.ok ? r.json() : { articles: FALLBACK_ARTICLES }; })
          .catch(function() { return { articles: FALLBACK_ARTICLES }; }),
        fetch(csr.apiEndpoint + '/api/domains/status', lowPriorityOpts)
          .then(function(r) { return r.ok ? r.json() : null; })
          .catch(function() { return null; })
      ]).then(function(results) {
        var articlesData = results[0];
        var domainsData = results[1];
        if (!articlesData || !Array.isArray(articlesData.articles)) return;

        var rawDomains = (domainsData && Array.isArray(domainsData.activeHttp200Domains))
          ? domainsData.activeHttp200Domains
          : [];
        var domainPool = normalizeAllowedFrontendDomains(rawDomains);

        var list = articlesData.articles.filter(function(item) {
          return item && item.slug && item.slug !== currentSlug;
        }).slice(0, 5);
        if (list.length === 0) return;

        var linksHtml = list.map(function(item, idx) {
          var targetOrigin = String(domainPool[idx % domainPool.length] || csr.vercelOrigin).replace(/\/+$/, '');
          var crossDomainHref = targetOrigin + '/?category=' + encodeURIComponent(item.category) + '&slug=' + encodeURIComponent(item.slug);
          var hostLabel = targetOrigin.replace(/^https?:\/\//, '');

          return (
            '<li class="' + TW.relatedLinksItem + '">' +
              '<a class="' + TW.relatedLinksAnchor + '" href="' + escapeHtml(crossDomainHref) + '" target="_blank" rel="noopener">' +
                escapeHtml(item.title) +
              '</a>' +
              '<div class="' + TW.relatedLinksMetaWrap + '">' +
                '<span class="' + TW.relatedLinksCatBadge + '">' + escapeHtml(item.categoryLabel || item.category) + '</span>' +
                '<span class="' + TW.relatedLinksDomainBadge + '">' + escapeHtml(hostLabel) + '</span>' +
              '</div>' +
            '</li>'
          );
        }).join('');

        mountEl.innerHTML =
          '<aside aria-label="Related Links Across All Categories and Domains" class="' + TW.relatedLinksSection + '" data-component="related-links">' +
            '<h2 class="' + TW.relatedLinksHeader + '">Related Links</h2>' +
            '<ul class="' + TW.relatedLinksList + '">' + linksHtml + '</ul>' +
          '</aside>';
      });
    }

    /**
     * PAGE 1: SINGLE ARTICLE PAGE (`/?category=<category>&slug=<slug>`)
     */
    function renderSingleArticle(article) {
      if (navEl) {
        // Explicitly NO categories listing on Single Article page
        navEl.innerHTML =
          '<a class="' + TW.navLink + '" data-route="home" href="/">Home</a>' +
          '<a class="' + TW.navLink + ' font-mono" data-route="sitemap" href="/sitemap.xml">sitemap.xml</a>';
      }

      var sentences = parseJsonArrayField(article.sentences, article.json_sentences);
      var images = parseJsonArrayField(article.images, article.json_images);
      var catSlug = article.category || csr.category;
      var catLabel = article.categoryLabel || catSlug;
      var articleSlug = article.slug || csr.slug;

      var articleCanonicalUrl = buildArticleCanonicalUrl(catSlug, articleSlug);
      var categoryCanonicalUrl = buildCategoryCanonicalUrl(catSlug);
      var categoryHref = buildCategoryHref(catSlug);

      var heroHtml = '';
      if (images.length > 0 && images[0] && images[0].url) {
        var firstImg = images[0];
        var hW = Number(firstImg.width) || 800;
        var hH = Number(firstImg.height) || 500;
        heroHtml =
          '<figure class="' + TW.heroFigure + '">' +
            '<img alt="' + escapeHtml(firstImg.alt || article.title) + '" class="' + TW.heroImg + '" decoding="sync" fetchpriority="high" height="' + hH + '" loading="eager" src="' + escapeHtml(firstImg.url) + '" style="aspect-ratio: ' + hW + ' / ' + hH + ';" width="' + hW + '"/>' +
            '<figcaption class="' + TW.figureCaption + '">' + escapeHtml(firstImg.title || firstImg.alt || article.title) + '</figcaption>' +
          '</figure>';
      }

      var paragraphs = [];
      for (var i = 0; i < sentences.length; i += 3) {
        paragraphs.push(sentences.slice(i, i + 3).join(' '));
      }

      var extraImages = images.slice(1);
      var imgIndex = 0;
      var imgStride = extraImages.length > 0
        ? Math.max(2, Math.floor(paragraphs.length / (extraImages.length + 1)))
        : 999999;

      var contentBlocks = [];
      for (var p = 0; p < paragraphs.length; p++) {
        contentBlocks.push('<p class="' + TW.sentenceParagraph + '">' + escapeHtml(paragraphs[p]) + '</p>');
        if (imgIndex < extraImages.length && ((p + 1) % imgStride === 0)) {
          var diag = extraImages[imgIndex++];
          if (diag && diag.url) {
            var dW = Number(diag.width) || 700;
            var dH = Number(diag.height) || 440;
            contentBlocks.push(
              '<figure class="' + TW.inlineFigure + '">' +
                '<img alt="' + escapeHtml(diag.alt || diag.title || article.title) + '" class="' + TW.inlineImg + '" decoding="async" height="' + dH + '" loading="lazy" src="' + escapeHtml(diag.url) + '" style="aspect-ratio: ' + dW + ' / ' + dH + ';" width="' + dW + '"/>' +
                '<figcaption class="' + TW.figureCaption + '">' + escapeHtml(diag.title || diag.alt || article.title) + '</figcaption>' +
              '</figure>'
            );
          }
        }
      }

      while (imgIndex < extraImages.length) {
        var remImg = extraImages[imgIndex++];
        if (remImg && remImg.url) {
          var rW = Number(remImg.width) || 700;
          var rH = Number(remImg.height) || 440;
          contentBlocks.push(
            '<figure class="' + TW.inlineFigure + '">' +
              '<img alt="' + escapeHtml(remImg.alt || remImg.title || article.title) + '" class="' + TW.inlineImg + '" decoding="async" height="' + rH + '" loading="lazy" src="' + escapeHtml(remImg.url) + '" style="aspect-ratio: ' + rW + ' / ' + rH + ';" width="' + rW + '"/>' +
              '<figcaption class="' + TW.figureCaption + '">' + escapeHtml(remImg.title || remImg.alt || article.title) + '</figcaption>' +
            '</figure>'
          );
        }
      }

      mainEl.innerHTML =
        '<article class="' + TW.articleContainer + '">' +
          '<nav aria-label="Breadcrumb" class="' + TW.breadcrumb + '">' +
            '<a class="' + TW.breadcrumbLink + '" data-route="home" href="/">Home</a>' +
            '<span>/</span>' +
            '<a class="' + TW.breadcrumbLink + '" data-route="category" data-category="' + escapeHtml(catSlug) + '" href="' + escapeHtml(categoryHref) + '">' + escapeHtml(catLabel) + '</a>' +
            '<span>/</span>' +
            '<span aria-current="page" class="text-slate-800 font-semibold">' + escapeHtml(article.title) + '</span>' +
          '</nav>' +
          '<header>' +
            '<a class="' + TW.categoryBadge + '" data-route="category" data-category="' + escapeHtml(catSlug) + '" href="' + escapeHtml(categoryHref) + '">' + escapeHtml(catLabel) + '</a>' +
            '<h1 class="' + TW.articleTitle + '">' + escapeHtml(article.title) + '</h1>' +
          '</header>' +
          heroHtml +
          '<div class="' + TW.sentencesWrapper + '" id="article-json-sentences">' +
            contentBlocks.join('') +
          '</div>' +
        '</article>' +
        '<div id="article-related-posts-mount"></div>' +
        '<div id="article-related-links-mount"></div>';

      var metaDesc = article.metaDesc || article.meta_desc || (sentences.slice(0, 2).join(' ').slice(0, 157));
      document.title = article.title + ' - ' + csr.blogTitle;
      setCanonicalUrl(articleCanonicalUrl);
      setHeadMeta('meta-robots', 'index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1');
      setHeadMeta('meta-seo', metaDesc);

      var imageUrls = images.map(function(img) { return img && img.url; }).filter(Boolean);
      setJsonLd('json-ld-schema', {
        '@context': 'https://schema.org',
        '@type': 'Article',
        'mainEntityOfPage': { '@type': 'WebPage', '@id': articleCanonicalUrl },
        'headline': article.title,
        'description': metaDesc,
        'image': imageUrls,
        'articleSection': catLabel,
        'datePublished': toIsoDate(article.createdAt || article.created_at),
        'dateModified': toIsoDate(article.updatedAt || article.updated_at || article.createdAt || article.created_at),
        'author': { '@type': 'Organization', 'name': csr.blogTitle, 'url': csr.vercelOrigin + '/' },
        'publisher': { '@type': 'Organization', 'name': csr.blogTitle, 'url': csr.vercelOrigin + '/' }
      });

      setJsonLd('json-ld-breadcrumb', {
        '@context': 'https://schema.org',
        '@type': 'BreadcrumbList',
        'itemListElement': [
          { '@type': 'ListItem', 'position': 1, 'name': 'Home', 'item': csr.vercelOrigin + '/' },
          { '@type': 'ListItem', 'position': 2, 'name': catLabel, 'item': categoryCanonicalUrl },
          { '@type': 'ListItem', 'position': 3, 'name': article.title, 'item': articleCanonicalUrl }
        ]
      });

      fetchAndRenderRelatedPostsDeferred(articleSlug);
      fetchAndRenderRelatedLinksDeferred(articleSlug);
    }

    function buildPostCardHtml(post, idx) {
      var postHref = buildArticleHref(post.category, post.slug);
      var catHref = buildCategoryHref(post.category);
      var imgUrl = post.thumbnail || post.image || '';
      var isPriorityImg = idx < 3;

      var imageBlock = imgUrl
        ? '<a class="' + TW.cardImgLink + '" data-route="article" data-category="' + escapeHtml(post.category) + '" data-slug="' + escapeHtml(post.slug) + '" href="' + escapeHtml(postHref) + '">' +
            '<img alt="' + escapeHtml(post.imageAlt || post.title) + '" class="' + TW.cardImg + '" decoding="' + (isPriorityImg ? 'sync' : 'async') + '" fetchpriority="' + (isPriorityImg ? 'high' : 'auto') + '" height="400" loading="' + (isPriorityImg ? 'eager' : 'lazy') + '" src="' + escapeHtml(imgUrl) + '" style="aspect-ratio: 640 / 400;" width="640"/>' +
          '</a>'
        : '';

      return (
        '<article class="' + TW.postCard + '">' +
          imageBlock +
          '<div class="' + TW.cardBody + '">' +
            '<div>' +
              '<a class="' + TW.cardCatLink + '" data-route="category" data-category="' + escapeHtml(post.category) + '" href="' + escapeHtml(catHref) + '">' + escapeHtml(post.categoryLabel || post.category) + '</a>' +
              '<h2 class="' + TW.cardTitle + '">' +
                '<a data-route="article" data-category="' + escapeHtml(post.category) + '" data-slug="' + escapeHtml(post.slug) + '" href="' + escapeHtml(postHref) + '">' + escapeHtml(post.title) + '</a>' +
              '</h2>' +
              '<p class="' + TW.cardExcerpt + '">' + escapeHtml(post.excerpt || '') + '</p>' +
            '</div>' +
            '<a class="' + TW.cardReadMore + '" data-route="article" data-category="' + escapeHtml(post.category) + '" data-slug="' + escapeHtml(post.slug) + '" href="' + escapeHtml(postHref) + '">Read article &#8594;</a>' +
          '</div>' +
        '</article>'
      );
    }

    /**
     * PAGE 2: HOMEPAGE (`/`)
     */
    function renderHomepage(data) {
      var articles = (data && Array.isArray(data.articles)) ? data.articles : [];
      var activeQuery = csr.q || (data && data.query) || '';

      var cardsHtml = articles.length > 0
        ? articles.map(function(post, idx) { return buildPostCardHtml(post, idx); }).join('')
        : '<div class="col-span-full bg-white rounded-xl border border-slate-200 p-8 text-center text-sm text-slate-600">' +
            'No matching technical articles found' + (activeQuery ? ' for "' + escapeHtml(activeQuery) + '"' : '') + '.' +
          '</div>';

      var subtitleText = activeQuery
        ? 'Search results for "' + escapeHtml(activeQuery) + '" across global category databases.'
        : 'Random technical guides and reference diagrams from global databases.';

      var clearSearchHtml = activeQuery
        ? '<a class="text-xs font-semibold text-blue-600 hover:underline cursor-pointer" data-route="home" href="/">Clear search &#10005;</a>'
        : '';

      mainEl.innerHTML =
        '<section>' +
          '<header class="' + TW.sectionHeader + '">' +
            '<div>' +
              '<h1 class="' + TW.sectionTitle + '">' + escapeHtml(csr.blogTitle) + '</h1>' +
              '<p class="' + TW.sectionDesc + '">' + subtitleText + '</p>' +
            '</div>' +
            clearSearchHtml +
          '</header>' +
          '<div class="' + TW.postsGrid + '">' + cardsHtml + '</div>' +
        '</section>';

      var homeCanonicalUrl = csr.vercelOrigin + '/';
      document.title = activeQuery ? ('Search: ' + activeQuery + ' - ' + csr.blogTitle) : csr.blogTitle;
      setCanonicalUrl(homeCanonicalUrl);
      setHeadMeta('meta-robots', 'index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1');
      setHeadMeta('meta-seo', csr.blogDescription);
      removeHeadElement('json-ld-breadcrumb');

      setJsonLd('json-ld-schema', {
        '@context': 'https://schema.org',
        '@type': 'WebSite',
        'name': csr.blogTitle,
        'url': homeCanonicalUrl,
        'description': csr.blogDescription,
        'mainEntity': {
          '@type': 'ItemList',
          'itemListElement': articles.slice(0, 10).map(function(item, index) {
            return {
              '@type': 'ListItem',
              'position': index + 1,
              'name': item.title,
              'url': buildArticleCanonicalUrl(item.category, item.slug)
            };
          })
        }
      });
    }

    /**
     * PAGE 3: CATEGORY PAGE (`/?category=<category>`)
     *   - <head>: 2 Meta Only (`meta robots` and `meta seo`) — ZERO JSON-LD
     */
    function renderCategoryPage(data) {
      var articles = (data && Array.isArray(data.articles)) ? data.articles : [];
      var catSlug = (data && data.category) || csr.category;
      var catLabel = (data && data.categoryLabel) || catSlug.replace(/[-_]+/g, ' ').replace(/\b\w/g, function(c) { return c.toUpperCase(); });
      var catCanonicalUrl = buildCategoryCanonicalUrl(catSlug);
      var catDesc = 'Explore random ' + catLabel + ' technical guides and diagrams on ' + csr.blogTitle + '.';

      var cardsHtml = articles.map(function(post, idx) {
        return buildPostCardHtml(post, idx);
      }).join('');

      mainEl.innerHTML =
        '<section>' +
          '<header class="' + TW.sectionHeader + '">' +
            '<div>' +
              '<h1 class="' + TW.sectionTitle + '">' + escapeHtml(catLabel) + '</h1>' +
              '<p class="' + TW.sectionDesc + '">' + escapeHtml(catDesc) + '</p>' +
            '</div>' +
            '<a class="text-xs font-semibold text-blue-600 hover:underline cursor-pointer" data-route="home" href="/">&#8592; All Categories</a>' +
          '</header>' +
          '<div class="' + TW.postsGrid + '">' + cardsHtml + '</div>' +
        '</section>';

      document.title = catLabel + ' - ' + csr.blogTitle;
      setCanonicalUrl(catCanonicalUrl);
      setHeadMeta('meta-robots', 'index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1');
      setHeadMeta('meta-seo', catDesc);

      removeHeadElement('json-ld-schema');
      removeHeadElement('json-ld-breadcrumb');
    }

    /**
     * PAGE 4: SITEMAP XML INSPECTOR & VERCEL SERVERLESS PREVIEW (`/sitemap.xml`)
     * Shows the exact XML generated by `/api/sitemap.js` after rewriting the backend
     * `<loc>` URLs to the active Vercel subdomain address (`csr.vercelOrigin`).
     */
    function renderSitemapXmlView(rawBackendXml) {
      var xmlString = typeof rawBackendXml === 'string' && rawBackendXml.indexOf('<urlset') !== -1
        ? rawBackendXml
        : buildSampleBackendSitemapXml();

      var rewrittenXml = rewriteBackendSitemapXmlToVercelOrigin(xmlString, csr.vercelOrigin);
      var sitemapCanonicalUrl = csr.vercelOrigin + '/sitemap.xml';

      document.title = 'XML Sitemap (application/xml) - ' + csr.blogTitle;
      setCanonicalUrl(sitemapCanonicalUrl);
      setHeadMeta('meta-robots', 'noindex, follow');
      setHeadMeta('meta-seo', 'Vercel Serverless XML Sitemap rewritten to ' + csr.vercelOrigin);
      removeHeadElement('json-ld-schema');
      removeHeadElement('json-ld-breadcrumb');

      // Extract rewritten <loc> URLs so user can also click and test them directly
      var locMatches = [];
      var locRegex = /<loc>\s*([^<\s]+)\s*<\/loc>/gi;
      var m;
      while ((m = locRegex.exec(rewrittenXml)) !== null) {
        locMatches.push(m[1].replace(/&amp;/g, '&'));
      }

      var clickableLocsHtml = locMatches.slice(0, 12).map(function(locUrl) {
        var parsedCat = '';
        var parsedSlug = '';
        try {
          var u = new URL(locUrl);
          parsedCat = u.searchParams.get('category') || '';
          parsedSlug = u.searchParams.get('slug') || '';
        } catch (e) {}
        return (
          '<li class="py-1.5 flex items-center justify-between gap-2 text-xs font-mono border-b border-slate-100 last:border-0">' +
            '<a class="text-blue-600 hover:underline truncate cursor-pointer" data-route="article" data-category="' + escapeHtml(parsedCat) + '" data-slug="' + escapeHtml(parsedSlug) + '" href="' + escapeHtml(buildArticleHref(parsedCat, parsedSlug)) + '">' +
              escapeHtml(locUrl) +
            '</a>' +
            '<span class="px-2 py-0.5 rounded bg-emerald-50 text-emerald-700 border border-emerald-200 text-[10px] shrink-0">Origin Rewritten</span>' +
          '</li>'
        );
      }).join('');

      mainEl.innerHTML =
        '<div class="max-w-4xl mx-auto space-y-6">' +
          '<section class="bg-white rounded-2xl border border-slate-200 shadow-sm p-6 sm:p-8">' +
            '<div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-4 mb-4 border-b border-slate-200">' +
              '<div>' +
                '<span class="inline-block px-2.5 py-0.5 rounded-full text-[11px] font-mono font-semibold bg-blue-50 text-blue-700 mb-1">Content-Type: application/xml; charset=UTF-8</span>' +
                '<h1 class="text-xl sm:text-2xl font-extrabold text-slate-900">Vercel Serverless XML Sitemap (<code class="font-mono text-lg">/sitemap.xml</code>)</h1>' +
                '<p class="mt-1 text-xs sm:text-sm text-slate-600">' +
                  'Reads <code class="font-mono text-xs bg-slate-100 px-1.5 py-0.5 rounded">' + escapeHtml(csr.apiEndpoint) + '/sitemap.xml</code> and rewrites all <code class="font-mono text-xs bg-slate-100 px-1.5 py-0.5 rounded">&lt;loc&gt;</code> origins to <code class="font-mono text-xs bg-blue-50 text-blue-700 px-1.5 py-0.5 rounded">' + escapeHtml(csr.vercelOrigin) + '</code>.' +
                '</p>' +
              '</div>' +
              '<a href="/sitemap.xml" target="_blank" rel="noopener" class="px-3.5 py-2 rounded-xl bg-slate-900 text-white text-xs font-mono font-semibold hover:bg-blue-600 transition-colors shrink-0 self-start">' +
                'Open Raw /sitemap.xml &#8599;' +
              '</a>' +
            '</div>' +
            '<div class="mb-5">' +
              '<h2 class="text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">Rewritten Sitemap &lt;loc&gt; Entries (Click to test CSR Article Route)</h2>' +
              '<ul class="bg-slate-50 rounded-xl border border-slate-200 px-4 py-2">' +
                clickableLocsHtml +
              '</ul>' +
            '</div>' +
            '<div>' +
              '<h2 class="text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">Raw XML Output (<code class="font-mono">application/xml</code>)</h2>' +
              '<pre class="p-4 rounded-xl bg-slate-900 text-emerald-300 font-mono text-xs overflow-x-auto leading-relaxed max-h-[420px]"><code>' + escapeHtml(rewrittenXml) + '</code></pre>' +
            '</div>' +
          '</section>' +
        '</div>';
    }

    function renderCategoryNavPills(categories) {
      if (Array.isArray(categories) && categories.length > 0) {
        cachedCategories = categories;
      }
      if (!navEl) return;

      // Single Article Page: NO categories listing in header nav
      if (csr.pageMode === 'article') {
        navEl.innerHTML =
          '<a class="' + TW.navLink + '" data-route="home" href="/">Home</a>' +
          '<a class="' + TW.navLink + ' font-mono" data-route="sitemap" href="/sitemap.xml">sitemap.xml</a>';
        return;
      }

      var activeCat = (csr.category || '').toLowerCase();
      var isHome = csr.pageMode === 'home' && !activeCat;
      var isSitemap = csr.pageMode === 'sitemap';

      var links = [
        '<a class="' + (isHome ? TW.navLinkActive : TW.navLink) + '" data-route="home" href="/">Home</a>',
        '<a class="' + (isSitemap ? TW.navLinkActive : TW.navLink) + ' font-mono" data-route="sitemap" href="/sitemap.xml">sitemap.xml</a>'
      ];

      for (var i = 0; i < cachedCategories.length; i++) {
        var c = cachedCategories[i];
        if (!c || !c.category) continue;
        var isCurrent = csr.pageMode === 'category' && activeCat === String(c.category).toLowerCase();
        links.push(
          '<a class="' + (isCurrent ? TW.navLinkActive : TW.navLink) + '" data-route="category" data-category="' + escapeHtml(c.category) + '" href="' + escapeHtml(buildCategoryHref(c.category)) + '">' +
            escapeHtml(c.label || c.category) +
          '</a>'
        );
      }
      navEl.innerHTML = links.join('');
    }

    function ensureCategoriesLoadedDeferred() {
      if (csr.pageMode === 'article') return;
      if (cachedCategories.length > 0) {
        renderCategoryNavPills(cachedCategories);
        return;
      }
      fetch(csr.apiEndpoint + '/api/categories', {
        method: 'GET',
        headers: { 'Accept': 'application/json' },
        priority: 'low'
      })
        .then(function(r) { return r.ok ? r.json() : { categories: FALLBACK_CATEGORIES }; })
        .catch(function() { return { categories: FALLBACK_CATEGORIES }; })
        .then(function(data) {
          if (data && Array.isArray(data.categories)) {
            renderCategoryNavPills(data.categories);
          }
        });
    }

    function renderPayloadForCurrentMode(payload) {
      if (payload && typeof payload === 'object' && Array.isArray(payload.categories) && payload.categories.length > 0) {
        cachedCategories = payload.categories;
      }
      if (csr.pageMode === 'article') {
        renderSingleArticle(payload);
      } else if (csr.pageMode === 'category') {
        renderCategoryPage(payload);
        ensureCategoriesLoadedDeferred();
      } else if (csr.pageMode === 'sitemap') {
        renderSitemapXmlView(payload);
        ensureCategoriesLoadedDeferred();
      } else {
        renderHomepage(payload);
        renderCategoryNavPills(cachedCategories);
      }
    }

    function navigateToRoute(newRoute, pushHistory) {
      csr.pageMode = newRoute.pageMode;
      csr.category = newRoute.category || '';
      csr.slug = newRoute.slug || '';
      csr.q = newRoute.q || '';
      csr.canonicalUrl = csr.buildCanonicalForRoute(newRoute);

      if (searchInputEl) {
        searchInputEl.value = csr.q;
      }

      setCanonicalUrl(csr.canonicalUrl);

      if (pushHistory) {
        var targetUrl = '/';
        if (newRoute.pageMode === 'article') {
          targetUrl = '/?category=' + encodeURIComponent(newRoute.category) + '&slug=' + encodeURIComponent(newRoute.slug);
        } else if (newRoute.pageMode === 'category') {
          targetUrl = '/?category=' + encodeURIComponent(newRoute.category) + (newRoute.q ? '&q=' + encodeURIComponent(newRoute.q) : '');
        } else if (newRoute.pageMode === 'sitemap') {
          targetUrl = '/?page=sitemap';
        } else if (newRoute.q) {
          targetUrl = '/?q=' + encodeURIComponent(newRoute.q);
        }
        try {
          window.history.pushState(newRoute, '', targetUrl);
        } catch (e) {}
      }

      window.scrollTo(0, 0);

      var endpointUrl = csr.buildPrimaryApiUrl(newRoute);
      if (newRoute.pageMode === 'sitemap') {
        fetch(endpointUrl, {
          method: 'GET',
          headers: { 'Accept': 'application/xml, text/xml, */*' },
          priority: 'high'
        })
          .then(function(res) {
            if (!res.ok) throw new Error('HTTP ' + res.status);
            return res.text();
          })
          .then(function(xmlText) {
            renderPayloadForCurrentMode(xmlText);
          })
          .catch(function() {
            renderPayloadForCurrentMode(buildSampleBackendSitemapXml());
          });
        return;
      }

      fetch(endpointUrl, {
        method: 'GET',
        headers: { 'Accept': 'application/json' },
        priority: 'high'
      })
        .then(function(res) {
          if (!res.ok) {
            var err = new Error('HTTP ' + res.status);
            err.status = res.status;
            throw err;
          }
          return res.json();
        })
        .then(function(payload) {
          renderPayloadForCurrentMode(payload);
        })
        .catch(function(err) {
          if (err && err.status === 404) {
            setHeadMeta('meta-robots', 'noindex, nofollow');
            mainEl.innerHTML =
              '<section class="max-w-xl mx-auto bg-white rounded-2xl border border-slate-200 p-8 text-center">' +
                '<h1 class="text-lg font-bold text-slate-900">Content Not Found (404)</h1>' +
                '<p class="mt-2 text-sm text-slate-600">The requested category or technical article was not found on ' + escapeHtml(csr.apiEndpoint) + '.</p>' +
                '<a class="mt-4 inline-block px-4 py-2 rounded-lg bg-blue-600 text-white text-xs font-semibold cursor-pointer" data-route="home" href="/">Back to Home</a>' +
              '</section>';
            return;
          }
          var fallbackData = buildFallbackPayloadForRoute(newRoute);
          renderPayloadForCurrentMode(fallbackData);
        });
    }

    if (searchFormEl) {
      searchFormEl.addEventListener('submit', function(e) {
        e.preventDefault();
        var qVal = searchInputEl ? String(searchInputEl.value || '').trim() : '';
        var targetMode = csr.pageMode === 'category' && csr.category ? 'category' : 'home';
        navigateToRoute({
          pageMode: targetMode,
          category: targetMode === 'category' ? csr.category : '',
          slug: '',
          q: qVal
        }, true);
      });
    }

    document.addEventListener('click', function(e) {
      var anchor = e.target && e.target.closest ? e.target.closest('a[data-route]') : null;
      if (!anchor) return;
      if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;

      var routeType = anchor.getAttribute('data-route');
      if (!routeType) return;

      e.preventDefault();
      if (routeType === 'article') {
        navigateToRoute({
          pageMode: 'article',
          category: anchor.getAttribute('data-category') || '',
          slug: anchor.getAttribute('data-slug') || '',
          q: ''
        }, true);
      } else if (routeType === 'category') {
        navigateToRoute({
          pageMode: 'category',
          category: anchor.getAttribute('data-category') || '',
          slug: '',
          q: ''
        }, true);
      } else if (routeType === 'sitemap') {
        navigateToRoute({
          pageMode: 'sitemap',
          category: '',
          slug: '',
          q: ''
        }, true);
      } else {
        navigateToRoute({
          pageMode: 'home',
          category: '',
          slug: '',
          q: ''
        }, true);
      }
    });

    window.addEventListener('popstate', function() {
      var route = csr.resolveRouteFromLocation();
      navigateToRoute(route, false);
    });

    if (csr.dataPromise) {
      csr.dataPromise
        .then(function(payload) {
          renderPayloadForCurrentMode(payload);
        })
        .catch(function(err) {
          if (err && err.status === 404) {
            setHeadMeta('meta-robots', 'noindex, nofollow');
            mainEl.innerHTML =
              '<section class="max-w-xl mx-auto bg-white rounded-2xl border border-slate-200 p-8 text-center">' +
                '<h1 class="text-lg font-bold text-slate-900">Content Not Found (404)</h1>' +
                '<p class="mt-2 text-sm text-slate-600">The requested category or technical article was not found on ' + escapeHtml(csr.apiEndpoint) + '.</p>' +
                '<a class="mt-4 inline-block px-4 py-2 rounded-lg bg-blue-600 text-white text-xs font-semibold cursor-pointer" data-route="home" href="/">Back to Home</a>' +
              '</section>';
            return;
          }
          var initialRoute = csr.resolveRouteFromLocation();
          var fallbackPayload = buildFallbackPayloadForRoute(initialRoute);
          renderPayloadForCurrentMode(fallbackPayload);
        });
    }
  })();
  </script>
</body>
</html>
